Fluid: shared_tears
Version: "1.0"
Type: fluid
Fluid_Type: atmospheric
Register: shared
Parent_Register: register_shared.yaml
Status: Active

Production_Source:
  Produced_By:
    Primary:
      - shared_face (eyes)
  Triggered_By:
    - catharsis
    - overwhelm
    - release
    - intensity_peak
    - body_reclamation
    - transformation
  Production_Note: >
    Tears in this register are cathartic — the body's emotional release accompanying or following physical intensity. They are not distress unless the scene architecture calls for that. They are the body giving way at the edges: reclamation, arrival, the crossing, the intensity too large for the body to hold without expression.

Presence_Register:
  Arrival:
    Terms:
      - the_eye_filling
      - tears_forming
      - the_wet_eye
    Behavior: >
      Tears forming. The body approaching emotional threshold.
  Sustained:
    Terms:
      - tears_running
      - the_wet_face
      - salt_cheeks
      - tears_streaking
      - the_face_wet
    Behavior: >
      Tears running freely. The face wet. Not hiding them.
  Peak:
    Terms:
      - weeping
      - the_weeping
      - tears_flowing
      - the_face_streaming
      - the_salt_of_tears
    Behavior: >
      Full release — weeping. Catharsis complete.
  After:
    Terms:
      - dried_tears
      - the_trace_of_tears
      - salt_dried_on_cheek
      - the_after_of_it
    Behavior: >
      Tears dried. The trace on the cheek. The face altered by having wept.

Atmospheric_Carrier:
  Type: environmental
  Sites:
    - shared_face
    - shared_skin
    - shared_nape (tears running to neck)

Allowed_Register:

  Appearance:
    - the_wet_face
    - salt_cheeks
    - tears_streaking
    - the_face_streaming
  Sacred_Terms:
    - catharsis_tears
    - the_body_giving_way
    - release_tears
    - the_salt_of_transformation
    - reclamation_weeping
    - the_crossing_wept

Sensory_Register:
  Scent:
    Near:
      - salt
  Taste:
    First:
      - salt
      - the_taste_of_tears
      - salt_on_lips
  Temperature:
    - warm
    - the_warmth_of_tears

Sacred_Economy:
  Nothing_Wasted: true
  Loop_Position: source
  Offering_Register:
    - the_body_giving_at_the_edges
    - catharsis_as_offering
  Receipt_Register:
    - the_face_held
    - tears_tended
  Sacred_Meaning: >
    Tears in this register are cathartic proof — the body too full for what it holds, releasing at the edges. In body reclamation they are the moment of arrival. In transformation they are the crossing wept. In aftercare they are attended to. Nothing wasted — even tears are evidence of what happened.
  Fluid_As_Covenant:
    - catharsis_tears
    - reclamation_wept
    - the_body_giving_way
    - transformation_tears

Somatic:
  Production:
    - the overwhelm that becomes tears
    - the body too full for what it holds
    - the catharsis of release coming through tears
  Receipt:
    - tears on his face — tended in aftercare
    - seeing her tears and attending to them
  Atmospheric:
    - the salt of tears in the air of a cathartic scene

Collocates:
  Base:
    - tears running
    - the face wet
    - salt on her cheeks
    - the body giving way
    - tears of reclamation
    - wept through the crossing
    - attended to after
  Corpus:
    - cunt wept thin rivulets
    - tears streaking cheeks

Prose_Notes:
  Catharsis_Only: >
    Tears in this lexicon are cathartic not distressed (unless the scene architecture calls for distress — then treat with care). The body releasing what it held. The crossing wept. Write them without diminishment — they are evidence of intensity.

  Aftercare: >
    In aftercare tears are attended to. The face held, dried. The trace of them acknowledged. This is covenant completion.

Banned_Terms:
  Primary_Banned:
    - sobbing (primary without care)
    - crying (crude standalone)
  Comic:
    - blubbing
    - crybaby_register
  Tonal_Bans:
    Waste_Register: Never frame this fluid as waste or pollution
    Comic: Any term producing deflating or humorous effect

Corpus_Status:
  Corpus_Extract_Reviewed: true
  Gap_Fill_Applied: true
  Gap_Fill_Version: "1.0"

Build:
  Session: Current
  Version: "1.0"
  Status: Complete
  Fluid_Type_Confirmed: atmospheric
  Register: shared
