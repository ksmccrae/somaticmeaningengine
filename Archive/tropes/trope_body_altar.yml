Identity:
  Label: Body as Altar
  Description: >
    The body becomes the altar on which something
    happens. Not used carelessly — consecrated to a
    purpose. The table on which dough is kneaded.
    The altar on which the worship is performed.
    The vessel that holds and transforms. The conduit
    through which covenant passes. The body as sacred
    instrument of something larger than the act.

