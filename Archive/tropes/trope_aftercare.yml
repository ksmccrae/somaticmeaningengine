  Description: >
    The scene is not over when the peak passes.
    Aftercare is the covenant's completion — the
    tending that seals what happened. Oil applied.
    Cloth brought. The body cleaned and held.
    Marks kissed as relics. The breathing returned
    to normal with attention. What was done together
    is honoured in the tending after.

