Identity:
  Label: Fluid Ritual
  Register: sacred_consecration
  Tone: covenant_economy / nothing_wasted
  Description: >
    Fluids move between bodies with intention. What one
    body gives, the other receives. What is received
    may be returned. What spills is gathered. What
    mixes is consecrated. The no-waste economy of the
    body in covenant — nothing lost, everything given
    meaning by its passage. Mouth to cunt to arse
    and back. The cycling of what bodies produce into
    a closed sacred loop.

Power_Map:
  Default: Variable — established by scene context
  Exchange_Note: >
    Fluid ritual often operates reciprocally — both
    bodies as source and receiver simultaneously or
    in alternation. The power dynamic is carried by
    the scene architecture, not by the fluid movement
    itself. Gold from a sovereign body is a sovereign
    act. Saliva passed mouth to mouth is communion.
  Sacred_Economy: >
    The governing principle across all fluid ritual:
    nothing wasted. Every fluid has sacred register.
    What the body produces is offered. What is offered
    is received. The loop closes as covenant.

