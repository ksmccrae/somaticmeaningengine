Tonal_Bans:

  Comic_Deflation: >
    Any language deflating the scene into humour, parody, or
    self-consciousness. If a term makes the reader laugh at
    the scene rather than into it — ban it.

  Tragedy_Frame_Trans: >
    Any language framing trans embodiment as loss, damage,
    problem, or tragedy. Becoming is not tragedy. Reclamation
    is not tragedy. Arrival is not tragedy.

  Gatekeeping_Sovereignty: >
    Any language making sovereignty conditional on surgical
    status, hormone use, or physical characteristic.
    All configurations are sovereign.

  Anatomical_Reveal: >
    Using any body's anatomy as plot device, surprise, or reveal.
    Bodies are not reveals. Trans anatomy is not a plot twist.

  Comparative_Degradation: >
    Any comparison framing one body's anatomy as lesser.
    All bodies carry equal sacred register.

  Pollution_Frame: >
    Any language framing mixed or released fluids as waste,
    mess, filth, or pollution. Fluid is always consecration.
    Nothing the body produces is waste.

  Non_Consent_Frame: >
    Any language removing consent architecture from acts
    that require it. Yielding is chosen. Restraint is chosen.
    Depth is chosen.

  Atmospheric_As_Substance: >
    Writing musk or sweat as discrete fluid events.
    Musk rises and thickens. It does not pool or run.
    Sweat beads and slicks. It is not a named fluid event
    unless licked from skin or pooling in a fold.

  Staging_Violation: >
    Using peak-stage vocabulary when the scene is at early
    stage, or bead vocabulary when the scene has flooded.
