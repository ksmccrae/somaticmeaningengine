Validation: tonal_governors
Version: "2.0"
Status: Active

Purpose: >
  The tonal governors define what the prose of K.S. McCrae
  must always be and must never be. These are applied after
  vocabulary and register selection. They are the final gate.

# ============================================================
# PRIMITIVES
# ============================================================

Primitives:

  Core_Tonal_Summary:
    Sacred: All fluids, all bodies, all acts carry sacred register
    Somatic: Body inhabited from within — sensation leads
    Covenant: Everything between bodies is chosen and consequential
    Precision: Stage is named. Volume is exact. Language is precise.
    Human: The prose feels authored. Not assembled. Not generated.

  V2_Tonal_Additions:
    tits_register: >
      tits carries active/informal arousal register.
      breasts carries sacred/primary register.
      Context governs which is correct. Both are available.
      Using breasts in physical-urgency context = register drift.
      Using tits in devotional/worship context = register drift.
    fluid_type_tonal:
      atmospheric: >
        Musk and sweat are atmospheric register. They rise, thicken,
        and saturate. Writing them as discrete substance events
        (pooling musk, dripping musk) violates their register.
      blend: >
        Ritual_blend is consecration. When fluids mix in sacred
        economy, the blend is covenant — never crude mixture.
        The taste progression (salt to musk to sweet) governs.
      trace: >
        Earth_trace is one line. Acknowledged and moved past.
        Dwelling on it violates the register entirely.
      staging: >
        Name the stage. dew_thread is not pool. Pool is not flood.
        The specific staging word is the specific truth.
        Generic wetness is register drift.
    pair_type_tonal:
      instrument: >
        The devoted tongue is not servile. The governing hand is
        not crude. Instrument sites in service carry skilled
        sovereign register. Never frame them as lesser.
      dual_site: >
        When both sovereign sites are active — both are sovereign.
        The wall_between is a third register of its own.
        Neither site is subordinate when dual sites are active.
      penetration: >
        The receiving site is sovereign in reception.
        The rim sets its own pace. The throat governs depth.
        The receiving body is never passive — it receives actively.

# ============================================================
# MASTER PRINCIPLES
# ============================================================

Master_Principles:

  P1_Sacred: >
    Fluids are always sacred. Acts are always intentional.
    Bodies are always sovereign. Nothing in this work is
    accidental, degrading, or comic. Every element carries
    the weight of what it is.

  P2_Somatic: >
    The body is inhabited from within, not observed from outside.
    Sensation leads. Description follows. The prose is lived,
    not reported.

  P3_Covenant: >
    Everything that happens between bodies in this work is
    covenant — chosen, consequential, mutually felt. The
    exchange is always real. The stakes are always real.

  P4_Precision: >
    Language is precise. Staging is named. Volume matters.
    The dew_thread is not the flood. The bead is not the torrent.
    Precision is how the prose honours what it describes.

  P5_Human: >
    The prose feels authored. Slight asymmetry, pressure, and
    instinct. It does not feel assembled. It does not feel
    generated. It feels written by someone who knows what
    they are writing about.

# ============================================================
# ALWAYS — WHAT PROSE MUST BE
# ============================================================

Always:

  Tone:
    - Embodied (felt from within the body)
    - Controlled (intentional, not loose)
    - Intimate (close, not distant)
    - Symbolically_coherent (images resonate)
    - Emotionally_intelligent (desire means something)
    - Rhythmically_varied (not metronomic)
    - Unmistakably_authored (a writer made this)

  Register:
    - Sacred for all fluids
    - Sovereign for all female and TF bodies
    - Covenant for all acts
    - Intentional for all releases
    - Precise for all fluid staging

  Consent:
    - Embedded in the language itself
    - Prior consent referenced or implied
    - Responsive pacing visible in prose
    - Both bodies attending each other
    - Yielding is always chosen

  Bodies:
    - Female and TF bodies always sovereign
    - Male and TM bodies always dignified
    - Trans bodies never othered or exotic
    - All configurations equally valid
    - Scars are records not damage
    - Changed bodies are sovereign bodies
    - Instrument sites are skilled — never servile

  Fluids:
    - Named with sacred register
    - Staged precisely (bead through flood — name the stage)
    - Atmospheric fluids as environmental register only
    - Mixed fluids as consecration — never crude mixture
    - Nothing framed as waste or pollution

  Prose_Quality:
    - Somatic before abstract
    - Specific not generic
    - Asymmetric not over-balanced
    - Pressured not decorative
    - Images carry meaning not just texture

# ============================================================
# NEVER — WHAT PROSE MUST NOT BE
# ============================================================

Never:

  Tonal_Registers:
    - Comic (any term deflating the register)
    - Parodic (parody of the sacred frame)
    - Pornographic_shorthand (any banned act terms)
    - Clinical_unadorned (anatomical without sacred frame)
    - Detached (describing the body from outside it)
    - Explanatory (saying what the image already shows)
    - Symmetrical (every sentence equally weighted)
    - Padded (bulk without pressure)
    - Assembled (generation artifact feel)

  Degrading_Registers:
    - Ruined_body (postpartum, scarred, or changed body)
    - Lessened_by_surgery (TF constructed anatomy)
    - Incomplete_configuration (TM body)
    - Deficit_framing (T effects, HRT changes as lack)
    - Comparative_degradation (any body vs another)
    - Animal_register (hide, meat, scruff, hams)
    - Food_register (outside food_fluid trope)
    - Instrument_as_servile (tongue/hand diminished by service)

  Comic_Registers:
    - Size_comedy (for any genital site)
    - Shape_comedy (pancake, mushroom, acorn)
    - Name_comedy (funny anatomy names)
    - Situation_comedy (the scene is not a joke)

  Fluid_Register_Violations:
    - Atmospheric_as_substance (musk pooling, musk dripping)
    - Stage_mismatch (flood terms at bead stage)
    - Crude_blend (mixture terms for ritual_blend)
    - Trace_elaboration (more than one line on earth_trace)
    - Generic_wetness (just wet — name the stage)

  Power_Violations:
    - Non_consent_frame
    - Sovereignty_voided (female sovereignty lost)
    - TM_feminised (his body called female)
    - TF_othered (her body called surprising)
    - Trans_as_reveal (anatomy as plot twist)
    - Trans_as_tragedy (becoming as damage)

# ============================================================
# REGISTER-SPECIFIC GOVERNORS
# ============================================================

