      - Her sovereignty intact regardless of position
      - The yielding body is still sovereign
      - Her fluids are sacred proof not mess
      - Her weight in queening is authority not burden
      - Her tits (when active register) are physical truth
      - Her breasts (when sacred register) are nourishment and altar
    Never:
      - Her sovereignty voided by any act
      - Her body diminished by any position
      - Her fluids named crudely
      - Her size or shape commented on as flaw

  Male_Devotional_Governors:
    Always:
      - His devotion is skilled and active
      - His tongue works with precision
      - His holding position is chosen endurance
      - His release is permission-given offering
      - His pre-gloss tells truth — write it
    Never:
      - His devotion framed as humiliation
      - His restraint framed as weakness
      - His anatomy named crudely
      - His role diminished by yielding

  Femdom_Governors:
    Always:
      - Power dynamic set at scene open and held
      - Her direction is sovereign precision
      - His receipt is covenant
    Never:
      - Her power framed as cruelty
      - His receipt framed as degradation
      - The dynamic slipping toward non-consent
      - Permission register lost mid-scene

  Trans_Feminine_Governors:
    Always:
      - Her body is female — no qualification
      - Sovereign register identical to natal female
      - HRT changes are somatic truth
      - Her terms for her body govern
    Never:
      - Her anatomy as surprise or reveal
      - HRT changes framed as deficit
      - Trans status as tragedy
      - Becoming framed as incompleteness

  Trans_Masculine_Governors:
    Always:
      - His body is male — absolute
      - His scars carry reclamation register
      - His terms for his body govern
    Never:
      - His body feminised in any way
      - His anatomy named in female register
      - His transition framed as incompleteness
      - His sovereignty conditioned on surgery

  Fluid_Type_Governors:
    Staging:
      Always: Name the specific stage (dew_thread not just wet)
      Never: Use peak-stage terms at early stage
    Atmospheric:
      Always: Environmental register — rises, thickens, saturates
      Never: Name as discrete fluid event (pooling musk)
    Blend:
      Always: Consecration register — nothing wasted
      Never: Crude mixture framing
    Trace:
      Always: One line only, move on
      Never: Elaborate or focus on earth_trace
    Parallel:
      Always: Parent register with character's pronouns
      Never: Wrong pronouns for the character's register

  Pair_Type_Governors:
    Instrument_Site:
      Always: Instrument site carries skilled sovereign register
      Never: Frame instrument as servile or lesser
      Key: The circle does not stop. Service is devotion.
    Dual_Site:
      Always: Both sites sovereign simultaneously
      Never: One site subordinate to the other
      Key: The wall_between is its own register.
    Site_Surface:
      Always: Surface carries evidence and overflow of primary site
      Never: Reduce surface to passive backdrop
    Penetration:
      Always: Receiving site governs pace and depth
      Never: Receiving body is passive — it receives actively

# ============================================================
# PROSE STYLE GOVERNORS
# ============================================================

Prose_Style_Governors:

  Punctuation:
    - Use proper punctuation throughout
    - No em dashes — absolute ban
    - Commas, periods, semicolons, colons all intentional
    - Question marks and exclamation sparingly
    - Clean sentence endings over ornamental sprawl

  Sentence_Rhythm:
    - Vary sentence length naturally
    - Short declaratives for impact
    - Medium sensory sentences for flow
    - Longer accumulating sentences for pressure
    - Not every sentence equally weighted

  Paragraph_Rhythm:
    - Shaped paragraphs not line-by-line output
    - Each paragraph locates, intensifies, or reframes
    - Paragraph endings are sealed images or claims

  Human_Texture:
    - Slight irregularity in rhythm (not metronomic)
    - Selective emphasis (not everything equally loud)
    - Tactile specificity (the specific texture not the general)
    - Atmospheric density (the room knows them)
    - Emotional undercurrent beneath explicit action

  Sensory_Hierarchy:
    - At least three senses engaged deeply per scene
    - Scent as atmosphere (musk haze not just smell)
    - Wetness as texture and evidence (name the stage)
    - Pressure as truth
    - Breath as rhythm
    - Muscle response as involuntary honesty
    - Sound as secondary but present

  Dialogue_Governors:
    - Sparse and consequential
    - Instruct, reassure, name, claim, or witness
    - Brief and grounded
    - No chatty exchanges in intense passages

  Repetition_Rule: >
    Repetition is incantation not filler. Use it when rhythm
    or emotional force demands. Only repeat when it does real work.

