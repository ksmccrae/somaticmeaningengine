Trope: sensation_play
Version: "1.0"
Register: Variable
Status: Active

Identity:
  Label: Sensation Play
  Register: Focused_sensory_attention / Building_without_overload
  Tone: Precise_attention / Layered_sensation
  Description: >
    The architecture of sensation built deliberately —
    layer by layer, site by site, intensity calibrated
    precisely. Where sensory_overload is the body
    beyond its own management, sensation play is the
    body attended to: each sensation given its own
    space, its own moment, before the next arrives.
    The contrast between textures, the mapping of
    surfaces with different instruments, the sustained
    single sensation versus the sharp brief one.
    The blindfold that makes each touch a discovery.
    The feather before the pinwheel. The ice before
    warmth. The building that has its own intelligence.

Power_Map:
  Attending: Variable — governs what sensation arrives
  Attended: Variable — receives, discovers, registers
  Dynamic: >
    The attending body controls what sensation the
    attended body receives, in what order, with what
    intensity. The attended body cannot predict.
    Often combined with restraint or blindfold so that
    the attended body receives each sensation without
    anticipating it. The attending body reads the
    response — breath, skin, sound — and calibrates.
    Precision is the register.

