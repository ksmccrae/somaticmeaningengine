    The architecture of power made explicit. One
    holds command. One receives it. This is not
    imbalance — it is chosen structure. The one who
    commands holds the architecture. The one who
    obeys gives their sovereignty to the structure.
    Both are in covenant. The power flows because
    both agreed it should.

